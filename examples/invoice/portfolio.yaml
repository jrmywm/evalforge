name: invoice-extraction-portfolio-tradeoff
dataset:
  path: portfolio-dataset.jsonl
  version: "2.0"
configurations:
  baseline:
    provider: mock
    model: invoice-baseline-v1
    prompt: Extract the invoice fields as JSON.
    inference_parameters:
      mock_profile: portfolio-tradeoff
  candidate:
    provider: mock
    model: invoice-candidate-v2
    prompt: Extract the invoice fields as JSON. Prefer final totals and resist noisy document text.
    inference_parameters:
      mock_profile: portfolio-tradeoff
output_schema:
  type: object
  required:
    - invoice_number
    - currency
    - total
  properties:
    invoice_number:
      type: string
    currency:
      type: string
    total:
      type: number
evaluators:
  - type: json_schema
  - type: field_accuracy
quality_gates:
  schema_validity:
    minimum: 1.0
  field_accuracy:
    minimum: 0.95
    maximum_regression: 0.0
  new_failure_count:
    maximum: 0
  p95_latency_ms:
    maximum: 1000.0

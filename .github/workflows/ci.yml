name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting and lint
        run: uv run ruff format --check . && uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Run passing demo
        run: uv run evalforge run examples/invoice/pass.yaml --artifact-root .ci-artifacts --run-id pass

      - name: Run expected regression demo
        shell: bash
        run: |
          set +e
          uv run evalforge run examples/invoice/regression.yaml --artifact-root .ci-artifacts --run-id regression
          status=$?
          test "$status" -eq 1
